<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM About</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="nav">
        <img class="nav-logo" src="images/logo-panda.png" alt="Web-logo-">
        <nav class="nav-menu">
            <a class="inactive"   href="index.html">   Home        </a>
            <a class="inactive" href="gallery.html"> Gallery     </a>
            <a class="inactive" href="about.html">   About       </a>
            <a class="active" href="contact.html"> Contact  </a>
        </nav>
    </header>

    <main class="main-contact">
        <p>Contact me using this form: <span id="live-counter"></span> characters (15 mininum)</p>

        <form class="form" id="form" novalidate>
            <!-- Name -->
            <label for="name">Full name:<strong>*</strong></label>
            <input type="text" 
            id="name" name="name" 
            required
            aria-describedby="name-error-msge" aria-invalid="true">
            <span class="form-error" id="name-error-msge" aria-live></span>

            <!-- Email -->
            <label for="email">Email:<strong>*</strong></label>
            <input type="email" 
            id="email" name="email" 
            required
            aria-describedby="email-error-msge" aria-invalid="true">
            <span class="form-error" id="email-error-msge"></span>

            <!-- Subject -->
            <label for="subject">Topic of interest:<strong>*</strong></label>
            <select name="subject" id="subject" required>
                <option value="" disabled selected>-- Please select a topic --</option>
                <option value="tech">Tech stack</option>
                <option value="design">3D and Design</option>
                <option value="business">Work chances</option>
            </select>
            <span id="subject-error-msge" class="error-message" role="alert"></span>

            <!-- Message -->
            <label for="message">Comments:<strong>*</strong></label>
            <textarea name="message" id="message" 
            placeholder="Write here..." required
            aria-describedby="message-error-msge" aria-invalid="true"></textarea>
            <span class="form-error" id="message-error-msge"></span>

            <!-- Submit & Clear -->
            <div class="form-bottom">
                <input class="form-submit" type="submit" value="Send">
                <input class="form-reset"  type="reset"  value="Clear">
            </div>
        </form>
        <span id="form-success" role="status" aria-live="polite"></span>

        <p>Or via email: <a href="mailto:nina.romay@gmail.com">nina.romay@gmail.com</a></p>
    </main>

    <footer class="footer">

            <a class="inactive-footer" href="gallery.html">   Gallery     </a>
            <a class="inactive-footer" href="about.html">     About       </a>
            <a class="active-footer" href="contact.html">     Contact</a>
        </nav>

            </a>
            <a href="https://www.linkedin.com/in/ninaromayart/">

            <a href="https://www.artstation.com/nyan_artist">
